<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bw-img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bw-img2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="bw-img3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="bw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <!-- background + soft blobs -->
  <rect width="1200" height="750" fill="#f7fafa"/>
  <circle cx="1080" cy="80" r="190" fill="#ccfbf1" opacity="0.55"/>
  <circle cx="640" cy="430" r="120" fill="#ccfbf1" opacity="0.35"/>

  <!-- nav -->
  <text x="56" y="58" font-size="26" font-weight="800" fill="#0d9488">Baity</text>
  <text x="128" y="56" font-size="18" font-weight="700" fill="#134e4a">بيتي</text>
  <text x="300" y="55" font-size="15" font-weight="600" fill="#0f172a">Buy</text>
  <text x="360" y="55" font-size="15" fill="#64748b">Rent</text>
  <text x="426" y="55" font-size="15" fill="#64748b">Projects</text>
  <text x="510" y="55" font-size="15" fill="#64748b">Agents</text>
  <text x="586" y="55" font-size="15" fill="#64748b">About</text>
  <text x="924" y="55" font-size="15" font-weight="600" fill="#0f172a">Sign in</text>
  <rect x="1000" y="30" width="144" height="40" rx="20" fill="#0d9488"/>
  <text x="1072" y="55" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">List property</text>

  <!-- hero left -->
  <rect x="56" y="124" width="148" height="30" rx="15" fill="#ccfbf1"/>
  <text x="130" y="144" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1">REAL ESTATE · IRAQ</text>
  <text x="56" y="212" font-size="52" font-weight="800" fill="#0f172a">Find your next</text>
  <text x="56" y="272" font-size="52" font-weight="800" fill="#0d9488">home in Iraq</text>
  <text x="56" y="312" font-size="17" fill="#64748b">Thousands of verified listings across the country —</text>
  <text x="56" y="338" font-size="17" fill="#64748b">buy, rent or list your property in minutes.</text>

  <!-- hero search bar -->
  <rect x="56" y="372" width="560" height="64" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M86 396 a8 8 0 0 1 16 0 c0 6-8 14-8 14 s-8-8-8-14z" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="94" cy="396" r="2.6" fill="#94a3b8"/>
  <text x="116" y="410" font-size="15" fill="#94a3b8">City, district or project…</text>
  <line x1="332" y1="386" x2="332" y2="422" stroke="#eef2f4" stroke-width="2"/>
  <text x="352" y="410" font-size="15" fill="#475569">Any type</text>
  <path d="M428 400 l6 7 6-7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="478" y="382" width="124" height="44" rx="12" fill="#0d9488"/>
  <circle cx="514" cy="402" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="519" y1="407" x2="524" y2="412" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="536" y="409" font-size="15" font-weight="600" fill="#ffffff">Search</text>

  <!-- stats -->
  <text x="56" y="492" font-size="24" font-weight="800" fill="#0f172a">12k+</text>
  <text x="56" y="514" font-size="13" fill="#64748b">listings</text>
  <line x1="172" y1="470" x2="172" y2="514" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200" y="492" font-size="24" font-weight="800" fill="#0f172a">3k+</text>
  <text x="200" y="514" font-size="13" fill="#64748b">agents</text>
  <line x1="300" y1="470" x2="300" y2="514" stroke="#e2e8f0" stroke-width="2"/>
  <text x="328" y="492" font-size="24" font-weight="800" fill="#0f172a">40+</text>
  <text x="328" y="514" font-size="13" fill="#64748b">cities</text>

  <!-- hero right: layered cards -->
  <rect x="700" y="120" width="420" height="300" rx="24" fill="url(#bw-img)"/>
  <circle cx="1050" cy="170" r="30" fill="#fcd34d" opacity="0.85"/>
  <rect x="780" y="280" width="170" height="100" rx="4" fill="#f8fafc"/>
  <path d="M762 284 L865 220 L968 284 Z" fill="#0f172a" opacity="0.85"/>
  <rect x="806" y="308" width="36" height="36" rx="3" fill="url(#bw-sky)"/>
  <rect x="890" y="308" width="36" height="72" rx="3" fill="#134e4a"/>
  <rect x="985" y="316" width="100" height="64" rx="4" fill="#e2e8f0"/>
  <rect x="1000" y="332" width="26" height="26" rx="3" fill="url(#bw-sky)"/>
  <rect x="1044" y="332" width="26" height="26" rx="3" fill="url(#bw-sky)"/>
  <rect x="744" y="380" width="360" height="8" rx="4" fill="#0f172a" opacity="0.25"/>
  <!-- floating price card -->
  <rect x="664" y="372" width="200" height="92" rx="18" fill="#ffffff" stroke="#e8eef0"/>
  <rect x="682" y="392" width="52" height="52" rx="12" fill="url(#bw-img2)"/>
  <text x="748" y="412" font-size="14" font-weight="700" fill="#0f172a">Modern Villa</text>
  <text x="748" y="434" font-size="13" font-weight="700" fill="#0d9488">$120,000</text>
  <!-- floating "just listed" chip -->
  <rect x="980" y="430" width="150" height="44" rx="22" fill="#ffffff" stroke="#e8eef0"/>
  <circle cx="1006" cy="452" r="10" fill="#10b981"/>
  <path d="M1001.5 452 l3.5 3.5 6-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1024" y="457" font-size="13" font-weight="600" fill="#0f172a">Just listed</text>

  <!-- popular listings -->
  <text x="56" y="584" font-size="22" font-weight="800" fill="#0f172a">Popular listings</text>
  <text x="1144" y="584" font-size="14" font-weight="600" fill="#0d9488" text-anchor="end">View all →</text>

  <!-- card 1 -->
  <rect x="56" y="604" width="346" height="240" rx="18" fill="#ffffff" stroke="#e8eef0"/>
  <rect x="68" y="616" width="322" height="120" rx="12" fill="url(#bw-img2)"/>
  <rect x="150" y="688" width="90" height="48" rx="2" fill="#f8fafc"/>
  <path d="M140 690 L195 656 L250 690 Z" fill="#0f172a" opacity="0.8"/>
  <text x="72" y="766" font-size="16" font-weight="700" fill="#0f172a">Family House · Erbil</text>
  <text x="72" y="790" font-size="13" fill="#64748b">📍 Dream City  ·  🛏 5  ·  📐 320 m²</text>
  <text x="72" y="822" font-size="16" font-weight="800" fill="#0d9488">$185,000</text>

  <!-- card 2 -->
  <rect x="426" y="604" width="346" height="240" rx="18" fill="#ffffff" stroke="#e8eef0"/>
  <rect x="438" y="616" width="322" height="120" rx="12" fill="url(#bw-img)"/>
  <rect x="520" y="688" width="90" height="48" rx="2" fill="#f8fafc"/>
  <path d="M510 690 L565 656 L620 690 Z" fill="#0f172a" opacity="0.8"/>
  <text x="442" y="766" font-size="16" font-weight="700" fill="#0f172a">Apartment · Baghdad</text>
  <text x="442" y="790" font-size="13" fill="#64748b">📍 Zayouna  ·  🛏 3  ·  📐 140 m²</text>
  <text x="442" y="822" font-size="16" font-weight="800" fill="#0d9488">$760 / month</text>

  <!-- card 3 -->
  <rect x="796" y="604" width="346" height="240" rx="18" fill="#ffffff" stroke="#e8eef0"/>
  <rect x="808" y="616" width="322" height="120" rx="12" fill="url(#bw-img3)"/>
  <rect x="890" y="688" width="90" height="48" rx="2" fill="#f8fafc"/>
  <path d="M880 690 L935 656 L990 690 Z" fill="#0f172a" opacity="0.8"/>
  <text x="812" y="766" font-size="16" font-weight="700" fill="#0f172a">New Project · Basra</text>
  <text x="812" y="790" font-size="13" fill="#64748b">📍 Al-Jubaila  ·  off-plan  ·  Q4 2026</text>
  <text x="812" y="822" font-size="16" font-weight="800" fill="#0d9488">from $95,000</text>
</svg>
