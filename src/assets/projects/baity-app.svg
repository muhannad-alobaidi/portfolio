<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="ba-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="ba-hero2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="ba-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="860" fill="#f6f9f9"/>

  <!-- status bar -->
  <text x="28" y="38" font-size="15" font-weight="600" fill="#0f172a">9:41</text>
  <rect x="318" y="26" width="17" height="11" rx="2.5" fill="none" stroke="#0f172a" stroke-width="1.4"/>
  <rect x="320" y="28" width="10" height="7" rx="1" fill="#0f172a"/>
  <rect x="336" y="29" width="2" height="5" rx="1" fill="#0f172a"/>
  <path d="M296 37 a 9 9 0 0 1 14 0" fill="none" stroke="#0f172a" stroke-width="1.6"/>
  <path d="M299.5 33.5 a 5 5 0 0 1 7 0" fill="none" stroke="#0f172a" stroke-width="1.6"/>
  <circle cx="303" cy="36.5" r="1.4" fill="#0f172a"/>
  <rect x="272" y="33" width="2.5" height="5" rx="1" fill="#0f172a"/>
  <rect x="276.5" y="31" width="2.5" height="7" rx="1" fill="#0f172a"/>
  <rect x="281" y="29" width="2.5" height="9" rx="1" fill="#0f172a"/>
  <rect x="285.5" y="27" width="2.5" height="11" rx="1" fill="#94a3b8"/>

  <!-- header: location + bell -->
  <text x="28" y="86" font-size="12" fill="#64748b">CURRENT LOCATION</text>
  <text x="28" y="108" font-size="16" font-weight="700" fill="#0f172a">Baghdad, Iraq</text>
  <path d="M150 102 l5 6 5-6" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="356" cy="96" r="20" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M356 86 a7 7 0 0 1 7 7 v5 l3 4 h-20 l3 -4 v-5 a7 7 0 0 1 7 -7z" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="362" cy="88" r="4" fill="#f43f5e"/>

  <!-- headline with arabic accent -->
  <text x="28" y="160" font-size="30" font-weight="800" fill="#0f172a">Find your</text>
  <text x="28" y="198" font-size="30" font-weight="800" fill="#0d9488">perfect home</text>
  <text x="372" y="160" font-size="22" font-weight="700" fill="#99c9c2" text-anchor="end">بيتي</text>

  <!-- search pill -->
  <rect x="28" y="222" width="284" height="56" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="58" cy="250" r="8" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
  <line x1="64" y1="256" x2="70" y2="262" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="84" y="256" font-size="14" fill="#94a3b8">Search city or district…</text>
  <rect x="320" y="222" width="56" height="56" rx="20" fill="#0d9488"/>
  <line x1="338" y1="242" x2="358" y2="242" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="338" y1="250" x2="358" y2="250" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="338" y1="258" x2="358" y2="258" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="344" cy="242" r="3" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
  <circle cx="352" cy="250" r="3" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
  <circle cx="346" cy="258" r="3" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>

  <!-- filter chips -->
  <rect x="28" y="298" width="72" height="36" rx="18" fill="#0d9488"/>
  <text x="64" y="321" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Buy</text>
  <rect x="108" y="298" width="76" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="146" y="321" font-size="14" fill="#475569" text-anchor="middle">Rent</text>
  <rect x="192" y="298" width="120" height="36" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="252" y="321" font-size="14" fill="#475569" text-anchor="middle">New projects</text>

  <!-- featured row -->
  <text x="28" y="376" font-size="18" font-weight="700" fill="#0f172a">Featured</text>
  <text x="372" y="376" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">See all</text>

  <!-- featured card -->
  <rect x="28" y="392" width="344" height="290" rx="22" fill="#ffffff" stroke="#e8eef0"/>
  <!-- card image -->
  <rect x="40" y="404" width="320" height="170" rx="14" fill="url(#ba-hero)"/>
  <circle cx="320" cy="430" r="26" fill="#fcd34d" opacity="0.85"/>
  <!-- villa illustration -->
  <rect x="80" y="492" width="120" height="68" rx="3" fill="#f8fafc"/>
  <path d="M70 494 L140 452 L210 494 Z" fill="#0f172a" opacity="0.85"/>
  <rect x="96" y="510" width="26" height="26" rx="2" fill="url(#ba-sky)"/>
  <rect x="158" y="510" width="26" height="50" rx="2" fill="#134e4a"/>
  <rect x="226" y="520" width="78" height="40" rx="3" fill="#e2e8f0"/>
  <rect x="238" y="532" width="18" height="18" rx="2" fill="url(#ba-sky)"/>
  <rect x="270" y="532" width="18" height="18" rx="2" fill="url(#ba-sky)"/>
  <rect x="60" y="558" width="280" height="6" rx="3" fill="#0f172a" opacity="0.25"/>
  <!-- price + heart -->
  <rect x="52" y="416" width="92" height="30" rx="15" fill="#ffffff" opacity="0.95"/>
  <text x="98" y="436" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">$120,000</text>
  <circle cx="338" cy="552" r="17" fill="#ffffff"/>
  <path d="M338 558 c-6-4.5-9-7.5-9-11 a4.5 4.5 0 0 1 9-1.5 a4.5 4.5 0 0 1 9 1.5 c0 3.5-3 6.5-9 11z" fill="#f43f5e"/>
  <!-- card body -->
  <text x="44" y="610" font-size="18" font-weight="700" fill="#0f172a">Modern Villa</text>
  <rect x="296" y="594" width="64" height="24" rx="12" fill="#ecfdf5"/>
  <text x="328" y="610" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">For sale</text>
  <path d="M46 626 a6 6 0 0 1 12 0 c0 4.5-6 10-6 10 s-6-5.5-6-10z" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="52" cy="626" r="2" fill="#94a3b8"/>
  <text x="66" y="634" font-size="13" fill="#64748b">Al-Mansour, Baghdad</text>
  <line x1="44" y1="650" x2="356" y2="650" stroke="#f1f5f9" stroke-width="2"/>
  <text x="44" y="672" font-size="13" fill="#475569">🛏 4 beds</text>
  <text x="140" y="672" font-size="13" fill="#475569">🛁 3 baths</text>
  <text x="244" y="672" font-size="13" fill="#475569">📐 220 m²</text>

  <!-- second card peeking -->
  <rect x="28" y="700" width="344" height="120" rx="22" fill="#ffffff" stroke="#e8eef0"/>
  <rect x="40" y="712" width="96" height="96" rx="14" fill="url(#ba-hero2)"/>
  <rect x="58" y="756" width="60" height="36" rx="2" fill="#f8fafc"/>
  <path d="M52 758 L88 736 L124 758 Z" fill="#0f172a" opacity="0.8"/>
  <text x="152" y="738" font-size="16" font-weight="700" fill="#0f172a">City Apartment</text>
  <text x="152" y="760" font-size="12.5" fill="#64748b">📍 Karrada, Baghdad</text>
  <text x="152" y="790" font-size="15" font-weight="700" fill="#0d9488">$640 / month</text>
  <rect x="296" y="770" width="64" height="24" rx="12" fill="#fffbeb"/>
  <text x="328" y="786" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">Rent</text>

  <!-- bottom nav -->
  <rect x="0" y="800" width="400" height="60" fill="#ffffff"/>
  <line x1="0" y1="800" x2="400" y2="800" stroke="#eef2f4" stroke-width="2"/>
  <path d="M48 836 v-9 l9-7 9 7 v9 h-6 v-6 h-6 v6 z" fill="#0d9488"/>
  <circle cx="57" cy="848" r="2" fill="#0d9488"/>
  <circle cx="152" cy="828" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="157" y1="833" x2="162" y2="838" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M248 838 c-6-4.5-9-7.5-9-11 a4.5 4.5 0 0 1 9-1.5 a4.5 4.5 0 0 1 9 1.5 c0 3.5-3 6.5-9 11z" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="344" cy="826" r="5.5" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M334 842 a10 10 0 0 1 20 0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>
